<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cosmere Tracker — Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/theme.css"/>
<script src="/static/theme.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:16px;line-height:1.55;background-image:var(--glow);}
.app{max-width:1200px;margin:0 auto;padding:1.25rem 1rem 4rem;}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--border2);padding-bottom:1rem;margin-bottom:1.2rem;}
.app-title{font-family:var(--font-h);font-size:17px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;}
.app-title small{display:block;font-family:var(--font-b);font-size:12px;letter-spacing:.04em;text-transform:none;color:var(--text3);font-style:italic;}
.who{font-size:13px;color:var(--text2);} .who b{color:var(--gold2);}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.sep{flex:1;}
.btn{font-family:var(--font-h);font-size:11px;letter-spacing:.06em;padding:7px 13px;border-radius:var(--r);cursor:pointer;text-transform:uppercase;border:1px solid var(--border2);background:transparent;color:var(--gold2);}
.btn:hover{background:var(--accsoft);border-color:var(--gold);}
.btn.accent{background:var(--gold);color:var(--onacc);border-color:var(--gold);font-weight:600;}
.btn.accent:hover{background:var(--gold2);}
.btn.sm{padding:4px 9px;font-size:10px;}
.btn.danger{color:var(--err);border-color:rgba(200,80,80,.35);}
.btn.danger:hover{background:rgba(200,64,64,.14);}
.btn[disabled]{opacity:.5;cursor:default;}
.fi{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px;color:var(--text);font-family:var(--font-b);font-size:15px;outline:none;}
.fi:focus{border-color:var(--gold);}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:1.4rem;flex-wrap:wrap;}
.tab{font-family:var(--font-h);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;cursor:pointer;border:none;background:transparent;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.section-h{font-family:var(--font-h);font-size:13px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin:0 0 .3rem;}
.section-sub{font-size:13px;color:var(--text3);font-style:italic;margin-bottom:.9rem;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:1rem 1.1rem;box-shadow:var(--shadow);}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:1.4rem;}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:12px 14px;}
.stat .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);font-family:var(--font-h);}
.stat .v{font-family:var(--font-h);font-size:26px;color:var(--gold2);line-height:1.25;}
.stat .s{font-size:12px;color:var(--text3);font-style:italic;}
.stat.warn .v{color:var(--orange2);} .stat.bad .v{color:var(--err);} .stat.good .v{color:var(--ok);}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:1.4rem;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{font-family:var(--font-h);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-align:left;font-weight:400;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--accsoft);}
.mono{font-family:var(--font-h);font-size:12.5px;color:var(--text2);}
.num{text-align:right;font-family:var(--font-h);font-size:13px;}
.pill{display:inline-block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:var(--pill);border:1px solid var(--border2);color:var(--text3);font-family:var(--font-h);}
.pill.on{color:var(--gold);border-color:var(--gold);}
.pill.bad{color:var(--err);border-color:rgba(200,80,80,.45);}
.pill.ok{color:var(--ok);border-color:var(--ok);}
.wrap{overflow-x:auto;}
.empty{color:var(--text3);font-style:italic;font-size:14px;padding:.7rem 0;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow:auto;z-index:50;}
.overlay.on{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rl);padding:1.4rem;max-width:760px;width:100%;box-shadow:var(--shadow2);}
.modal-close{float:right;background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;}
.fl-lbl{font-size:10px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin:10px 0 4px;display:block;}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;}
.bars .b{flex:1;background:var(--gold);opacity:.75;border-radius:2px 2px 0 0;min-height:1px;position:relative;}
.bars .b:hover{opacity:1;}
.bars .b.err{background:var(--err);}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:5px;font-family:var(--font-h);letter-spacing:.05em;}
.legend{font-size:11px;color:var(--text3);font-style:italic;margin-top:6px;}
.evt{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.evt:last-child{border-bottom:none;}
.evt .t{font-family:var(--font-h);font-size:11px;color:var(--text3);white-space:nowrap;}
.evt .k{font-family:var(--font-h);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold2);white-space:nowrap;}
.evt .d{color:var(--text2);}
.evt.bad .k{color:var(--err);}
.msg{font-size:13px;font-style:italic;color:var(--text3);min-height:20px;}
.msg.ok{color:var(--ok);} .msg.bad{color:var(--err);}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="app-title">Panel de control<small id="sub">Cosmere Combat Tracker</small></div>
    <div class="row">
      <span class="who">Admin: <b id="me">…</b></span>
      <span id="themePicker"></span>
      <button class="btn sm" onclick="location.href='/dm'">Ir a la app</button>
      <button class="btn sm" onclick="logout()">Salir</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-t="resumen" onclick="setTab('resumen')">Resumen</button>
    <button class="tab" data-t="usuarios" onclick="setTab('usuarios')">Usuarios</button>
    <button class="tab" data-t="campanias" onclick="setTab('campanias')">Campañas</button>
    <button class="tab" data-t="eventos" onclick="setTab('eventos')">Eventos</button>
    <button class="tab" data-t="correo" onclick="setTab('correo')">Correo</button>
  </div>

  <div id="tab-resumen"></div>
  <div id="tab-usuarios" style="display:none"></div>
  <div id="tab-campanias" style="display:none"></div>
  <div id="tab-eventos" style="display:none"></div>
  <div id="tab-correo" style="display:none"></div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
var TAB='resumen', ME=null, DATA=null, USERS=[], TIMER=null;

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function closeModal(){$('overlay').classList.remove('on');}
function openModal(html){$('modal').innerHTML=html;$('overlay').classList.add('on');}

async function api(path,method,body){
  var o={method:method||'GET',headers:{'Content-Type':'application/json'}};
  if(body) o.body=JSON.stringify(body);
  var r=await fetch(path,o);
  if(r.status===401){location.href='/login';throw new Error('401');}
  if(r.status===403){location.href='/dm';throw new Error('403');}
  if(!r.ok){var e=await r.json().catch(function(){return{detail:'Error'};});alert(e.detail||'Error');throw new Error(e.detail);}
  return r.status===204?null:r.json();
}
async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/login';}

/* ── formato ── */
function nfmt(n){return (n==null?0:n).toLocaleString('es-AR');}
function bytes(b){
  if(!b) return '0 B';
  var u=['B','KB','MB','GB'], i=0;
  while(b>=1024&&i<u.length-1){b/=1024;i++;}
  return (i?b.toFixed(1):b)+' '+u[i];
}
function dur(s){
  if(s<60) return s+'s';
  var m=Math.floor(s/60), h=Math.floor(m/60), d=Math.floor(h/24);
  if(d) return d+'d '+(h%24)+'h';
  if(h) return h+'h '+(m%60)+'m';
  return m+'m';
}
/* Las marcas de tiempo vienen en UTC (así las guarda SQLite): se muestran en
   la hora de quien mira el panel. */
function fecha(ts,corta){
  if(!ts) return '—';
  var d=new Date(ts.replace(' ','T')+(ts.length<=19?'Z':''));
  if(isNaN(d)) return ts;
  return corta?d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
              :d.toLocaleString('es-AR');
}
function hace(ts){
  if(!ts) return 'nunca';
  var d=new Date(ts.replace(' ','T')+(ts.length<=19?'Z':''));
  if(isNaN(d)) return ts;
  var s=Math.max(0,Math.floor((Date.now()-d.getTime())/1000));
  if(s<90) return 'recién';
  return 'hace '+dur(s);
}

/* ── pestañas ── */
function setTab(t){
  TAB=t;
  ['resumen','usuarios','campanias','eventos','correo'].forEach(function(k){
    $('tab-'+k).style.display=k===t?'':'none';
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    b.classList.toggle('active',b.getAttribute('data-t')===t);
  });
  cargar();
}

async function cargar(){
  if(TAB==='resumen') await verResumen();
  if(TAB==='usuarios') await verUsuarios();
  if(TAB==='campanias') await verCampanias();
  if(TAB==='eventos') await verEventos();
  if(TAB==='correo') await verCorreo();
}

/* ── Resumen ── */
function stat(k,v,s,cls){
  return '<div class="stat '+(cls||'')+'"><div class="k">'+esc(k)+'</div>'
    +'<div class="v">'+v+'</div><div class="s">'+esc(s||'')+'</div></div>';
}
function barras(datos,valor,etiqueta,color){
  var max=1;
  datos.forEach(function(d){max=Math.max(max,valor(d));});
  var html='<div class="bars">';
  datos.forEach(function(d){
    var v=valor(d), h=Math.round(v/max*100);
    html+='<div class="b'+(color&&color(d)?' err':'')+'" style="height:'+Math.max(h,v?2:0.5)+'%" title="'
      +esc(etiqueta(d))+': '+nfmt(v)+'"></div>';
  });
  html+='</div>';
  if(datos.length) html+='<div class="axis"><span>'+esc(etiqueta(datos[0]))+'</span>'
    +'<span>máx '+nfmt(max)+'</span><span>'+esc(etiqueta(datos[datos.length-1]))+'</span></div>';
  return html;
}

async function verResumen(){
  DATA=await api('/api/admin/overview');
  var d=DATA, c=d.counts, t=d.trafico_24h;
  var errores=t.errores_5xx+t.errores_4xx;
  var html='<div class="stats">'
    +stat('Usuarios',nfmt(c.users),d.usuarios_nuevos_7d?('+'+d.usuarios_nuevos_7d+' esta semana'):'sin altas nuevas')
    +stat('En línea',nfmt(d.usuarios_online),d.sesiones_activas+' sesiones activas',d.usuarios_online?'good':'')
    +stat('Campañas',nfmt(c.campaigns),nfmt(c.characters)+' personajes')
    +stat('Bestiario',nfmt(c.enemies),nfmt(c.items)+' objetos en catálogos')
    +stat('Peticiones 24 h',nfmt(t.requests),'p95 '+t.p95_ms+' ms')
    +stat('Errores 24 h',nfmt(errores),t.errores_5xx+' del server / '+t.errores_4xx+' de cliente',
          t.errores_5xx?'bad':(errores?'warn':'good'))
    +stat('Respuesta media',t.avg_ms+' ms','pico '+t.max_ms+' ms',t.avg_ms>400?'warn':'')
    +stat('Base de datos',bytes(d.db_bytes),nfmt(c.inventory)+' filas de inventario')
    +stat('Encendido',dur(d.uptime),'versión '+esc(d.version))
    +stat('Correo',d.mail.enabled?'SMTP':'Outbox',
          d.mail.enabled?('por '+esc(d.mail.user)):'sin credenciales: se guarda en outbox/',
          d.mail.enabled?(d.mail_fallidos_7d?'warn':'good'):'warn')
    +'</div>';

  html+='<div class="grid2">'
    +'<div class="card"><div class="section-h">Peticiones por hora</div>'
      +'<div class="section-sub">Últimas 24 horas.</div>'
      +barras(d.horas,function(x){return x.requests;},function(x){return x.hora.slice(11)+' h';})
      +'</div>'
    +'<div class="card"><div class="section-h">Actividad por día</div>'
      +'<div class="section-sub">Últimos 14 días: peticiones, y en la tabla el detalle.</div>'
      +barras(d.dias,function(x){return x.requests;},function(x){return x.dia.slice(5);},
              function(x){return x.errores>0&&x.errores>x.requests*0.1;})
      +'<div class="legend">Las barras rojas son días con más de 10 % de respuestas con error.</div>'
      +'</div>'
    +'</div>';

  html+='<div class="grid2">'
    +'<div class="card"><div class="section-h">Rutas más pedidas</div><div class="section-sub">Últimas 24 horas.</div>'
      +'<div class="wrap"><table><thead><tr><th>Ruta</th><th class="num">Pedidos</th><th class="num">Media</th></tr></thead><tbody>'
      +(d.top_paths.map(function(p){
          return '<tr><td class="mono">'+esc(p.path)+'</td><td class="num">'+nfmt(p.n)+'</td>'
                +'<td class="num">'+p.avg_ms+' ms</td></tr>';
        }).join('')||'<tr><td colspan="3" class="empty">Todavía no hay tráfico registrado.</td></tr>')
      +'</tbody></table></div></div>'
    +'<div class="card"><div class="section-h">Lo más lento</div><div class="section-sub">Rutas con peor tiempo medio (mínimo 3 pedidos).</div>'
      +'<div class="wrap"><table><thead><tr><th>Ruta</th><th class="num">Media</th><th class="num">Pedidos</th></tr></thead><tbody>'
      +(d.lentos.map(function(p){
          return '<tr><td class="mono">'+esc(p.path)+'</td><td class="num">'+p.avg_ms+' ms</td>'
                +'<td class="num">'+nfmt(p.n)+'</td></tr>';
        }).join('')||'<tr><td colspan="3" class="empty">Nada para mostrar.</td></tr>')
      +'</tbody></table></div></div>'
    +'</div>';

  html+='<div class="card"><div class="row" style="margin-bottom:.6rem">'
    +'<div><div class="section-h">Últimos movimientos</div>'
    +'<div class="section-sub" style="margin:0">Entradas, altas, recuperaciones y acciones del panel.</div></div>'
    +'<div class="sep"></div><button class="btn sm" onclick="setTab(\'eventos\')">Ver todo</button></div>'
    +eventosHTML(d.eventos)+'</div>';

  html+='<div class="row" style="margin-top:1.2rem">'
    +'<span class="msg" id="mant"></span><div class="sep"></div>'
    +'<button class="btn sm" onclick="cargar()">Refrescar</button>'
    +'<button class="btn sm" onclick="purgar()">Purgar telemetría vieja ('+d.retencion_dias+' d)</button>'
    +'<button class="btn sm" onclick="recargarConfig()">Releer .env</button>'
    +'</div>';

  $('tab-resumen').innerHTML=html;
  $('sub').textContent='v'+d.version+' · '+d.db_path;
}

function eventosHTML(evs){
  if(!evs||!evs.length) return '<div class="empty">Nada registrado todavía.</div>';
  return evs.map(function(e){
    return '<div class="evt'+(e.ok?'':' bad')+'"><span class="t">'+esc(fecha(e.ts,true))+'</span>'
      +'<span class="k">'+esc(e.kind)+'</span>'
      +'<span class="d">'+esc(e.username||'—')+(e.detail?' · '+esc(e.detail):'')+'</span>'
      +'<span class="sep"></span><span class="t">'+esc(e.ip||'')+'</span></div>';
  }).join('');
}

async function purgar(){
  var r=await api('/api/admin/maintenance/purge','POST');
  var m=$('mant'); m.className='msg ok'; m.textContent='Listo: '+nfmt(r.borradas)+' filas borradas.';
}
async function recargarConfig(){
  var r=await api('/api/admin/maintenance/reload-config','POST');
  var m=$('mant'); m.className='msg ok';
  m.textContent='Configuración releída. Correo: '+(r.mail.enabled?('SMTP por '+r.mail.user):'modo outbox')+'.';
}

/* ── Usuarios ── */
async function verUsuarios(q){
  USERS=await api('/api/admin/users'+(q?('?q='+encodeURIComponent(q)):''));
  var html='<div class="row" style="margin-bottom:1rem">'
    +'<div><div class="section-h">Cuentas</div>'
    +'<div class="section-sub" style="margin:0">'+USERS.length+' cuentas. Hacé clic en una para ver el detalle.</div></div>'
    +'<div class="sep"></div>'
    +'<input class="fi" id="uq" placeholder="Buscar usuario o email" value="'+esc(q||'')+'" '
    +'onkeydown="if(event.key===\'Enter\')verUsuarios(this.value)"/>'
    +'<button class="btn" onclick="verUsuarios($(\'uq\').value)">Buscar</button></div>';

  html+='<div class="card"><div class="wrap"><table><thead><tr>'
    +'<th>#</th><th>Usuario</th><th>Email</th><th class="num">Camp.</th><th class="num">PJ</th>'
    +'<th class="num">Entradas</th><th>Última vez</th><th>Estado</th><th></th>'
    +'</tr></thead><tbody>';
  html+=USERS.map(function(u){
    var estado=u.blocked?'<span class="pill bad">Bloqueada</span>'
              :(u.admin?'<span class="pill on">Admin</span>':'<span class="pill">Normal</span>');
    return '<tr>'
      +'<td class="mono">'+u.id+'</td>'
      +'<td style="cursor:pointer" onclick="verUsuario('+u.id+')"><b>'+esc(u.username)+'</b></td>'
      +'<td class="mono">'+esc(u.email||'—')+'</td>'
      +'<td class="num">'+u.campanias+'</td><td class="num">'+u.personajes+'</td>'
      +'<td class="num">'+u.login_count+'</td>'
      +'<td class="mono" title="'+esc(fecha(u.visto||u.last_login))+'">'+esc(hace(u.visto||u.last_login))+'</td>'
      +'<td>'+estado+'</td>'
      +'<td class="row" style="gap:4px;justify-content:flex-end">'
        +'<button class="btn sm" onclick="resetUser('+u.id+')" title="Mandarle un correo para restablecer la contraseña">Reset</button>'
        +'<button class="btn sm" onclick="verUsuario('+u.id+')">Ver</button>'
      +'</td></tr>';
  }).join('')||'<tr><td colspan="9" class="empty">No hay cuentas que coincidan.</td></tr>';
  html+='</tbody></table></div></div>';
  $('tab-usuarios').innerHTML=html;
}

async function resetUser(uid){
  if(!confirm('Le mandamos un correo con enlace y código para que elija contraseña nueva. ¿Seguimos?')) return;
  var r=await api('/api/admin/users/'+uid+'/reset','POST');
  alert('Correo enviado a '+r.enviado_a+'. Vence en '+r.vence_en+' minutos.');
  verUsuarios($('uq')?$('uq').value:'');
}

async function verUsuario(uid){
  var d=await api('/api/admin/users/'+uid);
  var u=d.usuario;
  var html='<button class="modal-close" onclick="closeModal()">✕</button>'
    +'<div class="section-h" style="font-size:16px">'+esc(u.username)+'</div>'
    +'<div class="section-sub">Cuenta #'+u.id+' · creada el '+esc(fecha(u.created_at))+'</div>'
    +'<label class="fl-lbl">Usuario</label><input class="fi" id="eu-user" style="width:100%" value="'+esc(u.username)+'"/>'
    +'<label class="fl-lbl">Email</label><input class="fi" id="eu-email" style="width:100%" value="'+esc(u.email||'')+'"/>'
    +'<div class="row" style="margin-top:12px">'
      +'<label class="row" style="gap:6px;font-size:13px;color:var(--text2)">'
        +'<input type="checkbox" id="eu-block"'+(u.blocked?' checked':'')+(u.admin_fijo?' disabled':'')+'/> Bloqueada</label>'
      +'<label class="row" style="gap:6px;font-size:13px;color:var(--text2)">'
        +'<input type="checkbox" id="eu-admin"'+(u.admin?' checked':'')+(u.admin_fijo?' disabled':'')+'/> Administradora</label>'
      +'<div class="sep"></div><button class="btn accent" onclick="guardarUsuario('+u.id+')">Guardar</button>'
    +'</div>'
    +(u.admin_fijo?'<div class="section-sub" style="margin-top:8px">Es admin por configuración (ADMIN_EMAILS): no se le puede sacar el permiso desde acá.</div>':'')
    +'<div class="msg" id="eu-msg"></div>';

  html+='<div class="grid2" style="margin-top:14px">'
    +'<div><div class="section-h">Sesiones abiertas ('+d.sesiones.length+')</div>'
      +(d.sesiones.map(function(s){
          return '<div class="evt"><span class="k">'+esc(s.role)+'</span>'
            +'<span class="d">'+esc(s.ip||'—')+'</span><span class="sep"></span>'
            +'<span class="t">'+esc(hace(s.last_seen||s.created_at))+'</span></div>';
        }).join('')||'<div class="empty">Ninguna.</div>')
    +'</div>'
    +'<div><div class="section-h">Campañas ('+d.campanias.length+')</div>'
      +(d.campanias.map(function(c){
          return '<div class="evt"><span class="k">'+esc(c.system)+'</span>'
            +'<span class="d">'+esc(c.name)+'</span><span class="sep"></span>'
            +'<span class="t">'+c.miembros+' miembros</span></div>';
        }).join('')||'<div class="empty">Ninguna.</div>')
    +'</div></div>';

  html+='<div class="section-h" style="margin-top:12px">Últimos movimientos</div>'+eventosHTML(d.eventos);
  if(d.correos.length){
    html+='<div class="section-h" style="margin-top:12px">Correos a esta cuenta</div>'
      +d.correos.map(function(m){
        return '<div class="evt'+(m.ok?'':' bad')+'"><span class="t">'+esc(fecha(m.ts,true))+'</span>'
          +'<span class="k">'+esc(m.kind||m.mode)+'</span><span class="d">'+esc(m.subject)+'</span>'
          +'<span class="sep"></span><span class="t">'+(m.ok?esc(m.mode):esc(m.error))+'</span></div>';
      }).join('');
  }

  html+='<div class="row" style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px">'
    +'<button class="btn" onclick="resetUser('+u.id+')">Mandar reset de contraseña</button>'
    +'<button class="btn" onclick="cerrarSesiones('+u.id+')">Cerrar sus sesiones</button>'
    +'<div class="sep"></div>'
    +'<button class="btn danger" onclick="borrarUsuario('+u.id+',\''+esc(u.username)+'\')">Eliminar cuenta</button>'
    +'</div>';
  openModal(html);
}

async function guardarUsuario(uid){
  var body={username:$('eu-user').value.trim(), email:$('eu-email').value.trim(),
            blocked:$('eu-block').checked, is_admin:$('eu-admin').checked};
  var r=await api('/api/admin/users/'+uid,'POST',body);
  var m=$('eu-msg'); m.className='msg ok';
  m.textContent=r.cambios.length?('Guardado: '+r.cambios.join(', ')):'No había nada que cambiar.';
  verUsuarios($('uq')?$('uq').value:'');
}
async function cerrarSesiones(uid){
  var r=await api('/api/admin/users/'+uid+'/logout','POST');
  alert('Sesiones cerradas: '+r.cerradas);
  closeModal(); verUsuarios($('uq')?$('uq').value:'');
}
async function borrarUsuario(uid,nombre){
  if(prompt('Esto borra la cuenta "'+nombre+'" y TODO lo suyo (campañas, personajes, bestiario, objetos).\n\nEscribí el nombre de usuario para confirmar:')!==nombre) return;
  await api('/api/admin/users/'+uid,'DELETE');
  closeModal(); verUsuarios($('uq')?$('uq').value:'');
}

/* ── Campañas ── */
async function verCampanias(){
  var cs=await api('/api/admin/campaigns');
  var html='<div class="section-h">Campañas</div>'
    +'<div class="section-sub">'+cs.length+' campañas en la base. Borrar una elimina sus encuentros, personajes e inventarios.</div>'
    +'<div class="card"><div class="wrap"><table><thead><tr>'
    +'<th>#</th><th>Nombre</th><th>Sistema</th><th>DM</th><th class="num">Miembros</th>'
    +'<th class="num">PJ</th><th class="num">Encuentros</th><th class="num">Día</th><th>Creada</th><th></th>'
    +'</tr></thead><tbody>'
    +(cs.map(function(c){
        return '<tr><td class="mono">'+c.id+'</td><td><b>'+esc(c.name)+'</b></td>'
          +'<td><span class="pill">'+esc(c.system)+'</span></td>'
          +'<td class="mono">'+esc(c.dm||'—')+'</td>'
          +'<td class="num">'+c.miembros+'</td><td class="num">'+c.personajes+'</td>'
          +'<td class="num">'+c.encuentros+'</td><td class="num">'+(c.day_count||0)+'</td>'
          +'<td class="mono">'+esc(fecha(c.created_at,true))+'</td>'
          +'<td style="text-align:right"><button class="btn sm danger" onclick="borrarCampania('+c.id+',\''+esc(c.name).replace(/'/g,"\\'")+'\')">Eliminar</button></td></tr>';
      }).join('')||'<tr><td colspan="10" class="empty">No hay campañas.</td></tr>')
    +'</tbody></table></div></div>';
  $('tab-campanias').innerHTML=html;
}
async function borrarCampania(cid,nombre){
  if(!confirm('¿Eliminar la campaña "'+nombre+'" con todo lo que cuelga de ella?')) return;
  await api('/api/admin/campaigns/'+cid,'DELETE');
  verCampanias();
}

/* ── Eventos ── */
async function verEventos(kind){
  var evs=await api('/api/admin/events?limit=200'+(kind?('&kind='+encodeURIComponent(kind)):''));
  var tipos=(DATA&&DATA.eventos_tipos)||[];
  var html='<div class="row" style="margin-bottom:1rem">'
    +'<div><div class="section-h">Eventos</div>'
    +'<div class="section-sub" style="margin:0">Lo que fue pasando en el server, del más nuevo al más viejo.</div></div>'
    +'<div class="sep"></div>'
    +'<select class="fi" onchange="verEventos(this.value)"><option value="">Todos los tipos</option>'
    +tipos.map(function(t){
        return '<option value="'+esc(t.kind)+'"'+(t.kind===kind?' selected':'')+'>'+esc(t.kind)+' ('+t.n+')</option>';
      }).join('')
    +'</select></div>'
    +'<div class="card">'+eventosHTML(evs)+'</div>';

  var errs=await api('/api/admin/requests?limit=60&status=400');
  html+='<div class="section-h" style="margin-top:1.4rem">Peticiones con error</div>'
    +'<div class="section-sub">Respuestas 4xx y 5xx: lo que alguien intentó y no salió.</div>'
    +'<div class="card"><div class="wrap"><table><thead><tr><th>Cuándo</th><th>Método</th><th>Ruta</th>'
    +'<th class="num">Estado</th><th class="num">ms</th><th class="num">Usuario</th></tr></thead><tbody>'
    +(errs.map(function(r){
        return '<tr><td class="mono">'+esc(fecha(r.ts,true))+'</td><td class="mono">'+esc(r.method)+'</td>'
          +'<td class="mono">'+esc(r.path)+'</td>'
          +'<td class="num" style="color:'+(r.status>=500?'var(--err)':'var(--orange2)')+'">'+r.status+'</td>'
          +'<td class="num">'+r.ms+'</td><td class="num">'+(r.user_id||'—')+'</td></tr>';
      }).join('')||'<tr><td colspan="6" class="empty">Ningún error registrado. Bien ahí.</td></tr>')
    +'</tbody></table></div></div>';
  $('tab-eventos').innerHTML=html;
}

/* ── Correo ── */
async function verCorreo(){
  var d=await api('/api/admin/mail');
  var c=d.config;
  var html='<div class="section-h">Correo saliente</div>'
    +'<div class="section-sub">Con esto salen los mensajes de recuperación y de confirmación de cambio.</div>'
    +'<div class="grid2"><div class="card">'
      +'<div class="row"><span class="pill '+(c.enabled?'ok':'bad')+'">'+(c.enabled?'SMTP activo':'Modo outbox')+'</span></div>'
      +'<table style="margin-top:10px">'
      +'<tr><td class="mono">Servidor</td><td>'+esc(c.host)+':'+c.port+'</td></tr>'
      +'<tr><td class="mono">Cuenta</td><td>'+esc(c.user)+'</td></tr>'
      +'<tr><td class="mono">Remitente</td><td>'+esc(c.from_name)+'</td></tr>'
      +'<tr><td class="mono">Enlaces</td><td>'+esc(c.base_url)+'</td></tr>'
      +'<tr><td class="mono">Admins</td><td>'+esc((DATA&&DATA.admins||[]).join(', '))+'</td></tr>'
      +'</table>'
      +(c.enabled?'':'<div class="section-sub" style="margin-top:10px">Sin <b>MAIL_PASSWORD</b> en el <code>.env</code> los mensajes no salen a internet: se guardan en <span class="mono">'+esc(c.outbox)+'</span> y se abren con doble clic. La recuperación funciona igual (el código está adentro del archivo).</div>')
    +'</div>'
    +'<div class="card"><div class="section-h">Probar</div>'
      +'<div class="section-sub">Manda un mensaje real y muestra el error del servidor si falla.</div>'
      +'<div class="row"><input class="fi" id="mailto" style="flex:1" placeholder="'+esc(c.user)+'"/>'
      +'<button class="btn accent" onclick="probarCorreo()">Enviar prueba</button></div>'
      +'<div class="msg" id="mailmsg" style="margin-top:10px"></div>'
    +'</div></div>';

  html+='<div class="section-h" style="margin-top:1.2rem">Últimos envíos</div>'
    +'<div class="card"><div class="wrap"><table><thead><tr><th>Cuándo</th><th>Para</th><th>Asunto</th>'
    +'<th>Tipo</th><th>Modo</th><th>Resultado</th></tr></thead><tbody>'
    +(d.log.map(function(m){
        return '<tr><td class="mono">'+esc(fecha(m.ts,true))+'</td><td class="mono">'+esc(m.to_addr)+'</td>'
          +'<td>'+esc(m.subject)+'</td><td><span class="pill">'+esc(m.kind||'—')+'</span></td>'
          +'<td class="mono">'+esc(m.mode)+'</td>'
          +'<td>'+(m.ok?'<span class="pill ok">OK</span>':'<span class="pill bad" title="'+esc(m.error)+'">Falló</span>')+'</td></tr>';
      }).join('')||'<tr><td colspan="6" class="empty">Todavía no se mandó ningún correo.</td></tr>')
    +'</tbody></table></div></div>';
  $('tab-correo').innerHTML=html;
}

async function probarCorreo(){
  var m=$('mailmsg'); m.className='msg'; m.textContent='Enviando…';
  var r=await api('/api/admin/mail/test','POST',{to:$('mailto').value.trim()});
  m.className='msg '+(r.ok?'ok':'bad');
  m.textContent=(r.ok?'Enviado a ':'No salió a ')+r.destino+': '+r.detalle;
  setTimeout(verCorreo,1200);
}

/* ── arranque ── */
(async function(){
  ME=await api('/api/auth/me');
  $('me').textContent=ME.username;
  await cargar();
  // El resumen se refresca solo mientras esté a la vista.
  TIMER=setInterval(function(){ if(TAB==='resumen'&&!$('overlay').classList.contains('on')) verResumen(); },30000);
})();
</script>
